
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indore Region Dashboard</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f1f5f9;
}
header {
  background: #123b66;
  color: white;
  padding: 25px;
  text-align: center;
}
.container {
  padding: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 20px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
  text-align: center;
}
.card h2 {
  color: #123b66;
}
</style>
</head>
<body>

<header>
  <h1>INDORE REGION</h1>
  <h2>Business Monitoring Dashboard</h2>
  <p>Department of Posts</p>
</header>

<div class="container">
  <div class="card">
    <h2>Mail Business</h2>
    <p>Daily Performance</p>
  </div>
  <div class="card">
    <h2>Parcel Business</h2>
    <p>Target & Achievement</p>
  </div>
  <div class="card">
    <h2>Bank & NBFC</h2>
    <p>Daily Contact Reports</p>
  </div>
  <div class="card">
    <h2>PMEGP</h2>
    <p>Verification Progress</p>
  </div>
  <div class="card">
    <h2>Magazine Post</h2>
    <p>Customer Progress</p>
  </div>
  <div class="card">
    <h2>Other Verticals</h2>
    <p>Business Reports</p>
  </div>
</div>

</body>
</html>
